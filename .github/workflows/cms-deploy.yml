name: CMS deploy

# Builds the Strapi admin panel in CI (where there is more than 512 MB), pushes a
# production image to GHCR (public package), and tells DigitalOcean App Platform to pull
# it. The 512 MB App Platform container runs the image and never compiles the admin — see
# docs/adr/0002-cms.md decision 4.
#
# This is a deploy path, not a merge gate. No Tier A / Tier B check asserts the CMS
# schema (docs/adr/0004-verification.md); docs/task-assignments.html marks cms-platform
# "no gate".

on:
  push:
    branches: [main]
    paths:
      - 'apps/cms/**'
      - '.dockerignore'
      - '.github/workflows/cms-deploy.yml'
  workflow_dispatch:

concurrency:
  group: cms-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/cms

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger App Platform deploy
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$APP_ID" ]; then
            echo "DIGITALOCEAN_ACCESS_TOKEN or DIGITALOCEAN_APP_ID is not set — skipping. Add both in repo Settings > Secrets once the App Platform app exists (docs/ops/cms-runbook.md step 4)." >&2
            exit 1
          fi
          # App Platform does not watch GHCR tags; a new deployment re-pulls :latest.
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"force_build": false}' \
            "https://api.digitalocean.com/v2/apps/$APP_ID/deployments" > /dev/null
