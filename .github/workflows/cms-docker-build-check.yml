name: CMS Docker build check (temporary)

# TEMPORARY — exists only on fix/cms-r2-startup-guard to validate the literal
# `docker build -f apps/cms/Dockerfile .` after moving the R2 production guard out of
# config/plugins.ts and into src/index.ts's register() hook, so `strapi build` no longer
# throws in CI when R2_* secrets are absent. Remove this file before opening the PR —
# it is deliberately separate from cms-deploy.yml and must never be merged to main.
#
# Manual-only, build-only, no push: checks out the dispatched ref, runs the Dockerfile's
# build stage (which is the only stage that runs `npm run build` / `strapi build`) through
# Buildx, and stops. No registry login, no image tag, no push, no second job, no secrets
# of any kind — so there is no path from this workflow to GHCR or to Render.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-check:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build apps/cms image (no push, no tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: false
