name: Tier B hero signature
on:
  push:
    branches: [change/hero-signature]
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tests/hero-signature/**"
      - "package*.json"
      - ".github/workflows/tier-b-hero-signature.yml"
permissions:
  contents: read
jobs:
  hero-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/hero-signature
      - run: node --test tests/hero/baseline.test.mjs tests/home/composition.test.mjs
      - run: npm exec --prefix tests/hero-signature -- playwright install --with-deps chromium firefox
      - run: npm --prefix tests/hero-signature test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-signature-recordings
          path: tests/hero-signature/test-results
          retention-days: 14
