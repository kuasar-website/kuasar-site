name: Tier B news baseline
# announcements (News): mapper, published-only loader and body renderer unit tests, then
# real production builds of /en/news and /tr/duyurular at zero and three announcements
# against a synthetic Strapi (published-only, drafts never public, Turkish fallback,
# ordering, media, escaped Markdown, metadata, lang, navigation, 404s, sitemap, no
# request-time CMS fetches, budgets). Not a required check; path-filtered.
on:
  push:
    branches: [launch/news]
    paths:
      - "apps/web/**"
      - "tests/news/**"
      - "package*.json"
      - ".nvmrc"
      - ".github/workflows/tier-b-news.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tests/news/**"
      - "package*.json"
      - ".nvmrc"
      - ".github/workflows/tier-b-news.yml"
permissions:
  contents: read
jobs:
  news-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test apps/web/lib/cms/announcements.test.ts apps/web/lib/cms/announcements-data.test.ts apps/web/components/news/body.test.ts
      - run: node tests/news/check-routes.mjs
