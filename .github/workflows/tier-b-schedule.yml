name: Tier B schedule
# Schedule calendar: unit derivation, controlled-clock browsers (en/tr), axe on
# the schedule fixture, and real production builds against a synthetic Strapi.
# Not a required check, so the path filter sits on the trigger. The list is
# the narrowest set that can change schedule behaviour — see
# openspec/changes/schedule-calendar/design.md D11 before widening it.
on:
  push:
    branches: [change/schedule-calendar]
    paths:
      - "apps/web/app/*/(schedule)/**"
      - "apps/web/app/sitemap.ts"
      - "apps/web/app/globals.css"
      - "apps/web/lib/schedule/**"
      - "apps/web/components/schedule/**"
      - "apps/web/lib/time/**"
      - "apps/web/lib/i18n/**"
      - "apps/web/lib/strapi/**"
      - "tests/schedule/**"
      - ".github/workflows/tier-b-schedule.yml"
      # Next/React upgrades change static generation and hydration.
      - "package-lock.json"
      - "apps/web/package.json"
      # Node's ICU data drives Europe/Istanbul formatting.
      - ".nvmrc"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/*/(schedule)/**"
      - "apps/web/app/sitemap.ts"
      - "apps/web/app/globals.css"
      - "apps/web/lib/schedule/**"
      - "apps/web/components/schedule/**"
      - "apps/web/lib/time/**"
      - "apps/web/lib/i18n/**"
      - "apps/web/lib/strapi/**"
      - "tests/schedule/**"
      - ".github/workflows/tier-b-schedule.yml"
      # Next/React upgrades change static generation and hydration.
      - "package-lock.json"
      - "apps/web/package.json"
      # Node's ICU data drives Europe/Istanbul formatting.
      - ".nvmrc"
permissions:
  contents: read
jobs:
  schedule-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/schedule
      # Calendar placement must not depend on the runner's zone.
      - run: TZ=UTC node --test apps/web/lib/schedule/*.test.ts
      - run: TZ=America/New_York node --test apps/web/lib/schedule/*.test.ts
      - run: npm exec --prefix tests/schedule -- playwright install --with-deps chromium firefox
      - run: npm --prefix tests/schedule test
      - run: node tests/schedule/check-routes.mjs
