<!--
  KUASAR wordmark. Artwork — do not re-typeset. See design/brand.md.

  Colour is inherited: every path is `currentColor`, so the mark takes the CSS
  `color` of its container. NEVER hardcode a fill here — the site canvas is
  near-black and a black wordmark is invisible on it.

  Letters are ordered K U A S A R below. The third glyph is the stylised
  rocket A; it and the fifth A overshoot the cap height slightly, which is
  intentional optical correction for pointed apexes, not misalignment.
-->
